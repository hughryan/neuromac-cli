theme = "neuromancer"

[editor]
line-number      = "relative"
mouse            = true
cursorline       = true
color-modes      = true
completion-trigger-len = 1
rulers           = []

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.indent-guides]
render    = true
character = "│"

[editor.statusline]
left      = ["mode", "spinner", "file-name", "file-modification-indicator"]
center    = []
right     = ["diagnostics", "selections", "position", "file-encoding", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.file-picker]
hidden = false
